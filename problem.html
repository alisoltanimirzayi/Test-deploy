<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحلیل و شناسایی مشکلات استانی</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background: #f0f4f8; }
        .topic-btn { 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
        }
        .topic-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.3) 100%);
            z-index: 1;
            transition: opacity 0.3s;
        }
        .topic-btn.active { 
            transform: translateY(-5px) scale(1.03); 
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25); 
            border-color: #3b82f6 !important; 
        }
        .topic-btn.active::before {
            background: linear-gradient(to top, rgba(37, 99, 235, 0.9) 0%, rgba(0,0,0,0.4) 100%);
        }
        .topic-btn span {
            position: relative;
            z-index: 2;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
    
    <header class="bg-white shadow-sm px-8 py-4 flex justify-between items-center z-10">
        <div>
            <h1 class="text-2xl font-black text-gray-800" id="header-prov">پروفایل استان</h1>
            <p class="text-sm text-gray-500 mt-1">شناسایی مزیت‌ها و چالش‌های منطقه‌ای</p>
        </div>
        <a href="index.html" class="bg-blue-50 text-blue-700 hover:bg-blue-100 font-bold px-5 py-2.5 rounded-xl border border-blue-200 transition">
            بازگشت به نقشه
        </a>
    </header>

    <main class="flex-1 overflow-y-auto p-8 flex flex-col gap-6">
        <!-- Top Section -->
        <div class="flex flex-col lg:flex-row gap-6 h-[50vh]">
            
            <!-- Circle-bar chart (Polar Area with Centered Province Label) -->
            <div class="flex-1 bg-white rounded-3xl shadow-sm border p-6 relative flex flex-col">
                <h3 class="text-lg font-bold text-gray-700 mb-4 border-r-4 border-blue-500 pr-3" id="polar-title">امتیازات زیرحوزه‌ها</h3>
                <div class="flex-1 relative w-full h-full flex justify-center items-center">
                    <canvas id="polarChart"></canvas>
                </div>
            </div>

            <!-- Intuition Boxes -->
            <div class="w-full lg:w-1/3 flex flex-col gap-6">
                <!-- Rank & Doughnut Box -->
                <div class="bg-white rounded-3xl shadow-sm border p-6 flex flex-col justify-center items-center flex-1 mt-4">
                    <div class="flex w-full justify-between items-center mb-6">
                        <div class="text-center w-1/2">
                            <span class="block text-gray-500 font-semibold mb-2">رتبه استان</span>
                            <div class="text-4xl font-black text-blue-600" id="box-rank" dir="ltr">- / 31</div>
                        </div>
                        <div class="w-1/2 relative h-32 flex justify-center items-center flex-col mt-2">
                            <span class="block text-gray-500 font-semibold absolute -top-10">امتیاز استان</span>
                            <canvas id="doughnutChart"></canvas>
                            <div class="absolute top-[60%] left-1/2 transform -translate-x-1/2 -translate-y-1/2 font-black text-2xl text-gray-800" id="box-score">-</div>
                        </div>
                    </div>
                </div>

                <!-- Last Period Change Box -->
                <div class="bg-gradient-to-r from-blue-600 to-blue-800 rounded-3xl shadow-lg p-6 text-white flex-1 flex flex-col justify-center items-center relative overflow-hidden">
                    <i class="fa-solid fa-chart-line absolute -left-4 -bottom-4 text-8xl opacity-10"></i>
                    <span class="text-blue-100 font-semibold text-lg mb-2 z-10">تغییرات نسبت به دوره گذشته</span>
                    <div class="text-5xl font-black z-10 flex items-center gap-4" id="box-change" dir="ltr">
                        - %
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Section: Topic Selector Cards Side-by-Side Filling Full Width -->
        <div class="bg-white rounded-3xl shadow-sm border p-6">
            <h3 class="text-lg font-bold text-gray-700 mb-6 border-r-4 border-indigo-500 pr-3">حوزه‌های ارزیابی (برای تغییر نمودار کلیک کنید)</h3>
            <div class="flex gap-4 w-full justify-between items-center" id="topics-container">
                <!-- Filled dynamically -->
            </div>
        </div>
    </main>

    <script>
        Chart.defaults.font.family = "'Vazirmatn', sans-serif";
        const urlParams = new URLSearchParams(window.location.search);
        const urlProvince = urlParams.get('province') || "تهران";
        let currentTopic = urlParams.get('topic') || "";

        let subtopicsData = [];
        let mapScoresData = [];
        let trendScoreData = [];
        let uniqueTopics = [];
        let polarChart = null;
        let doughnutChart = null;

        // Custom plugin to guarantee province text is exactly over the polar axis center
        const polarCenterTextPlugin = {
            id: 'polarCenterText',
            afterDraw: function(chart) {
                if(chart.config.type !== 'polarArea') return;
                let ctx = chart.ctx;
                let x = chart.scales.r.xCenter;
                let y = chart.scales.r.yCenter;
                
                // Get the exact radius where the 0-value starts
                let innerRadius = chart.scales.r.getDistanceFromCenterForValue(0);
                
                ctx.save();
                
                // Draw inner circle background filling the hole perfectly
                ctx.beginPath();
                ctx.arc(x, y, innerRadius, 0, 2 * Math.PI);
                ctx.fillStyle = "rgba(255, 255, 255, 1)";
                ctx.fill();
                
                // Border for the circle
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#e5e7eb";
                ctx.stroke();

                // Draw Text centered inside the circle
                ctx.font = "900 17px Vazirmatn";
                ctx.textBaseline = "middle";
                ctx.textAlign = "center";
                ctx.fillStyle = "#1f2937";
                ctx.fillText(urlProvince, x, y);
                
                ctx.restore();
            }
        };

        function parseCSV(text) {
            let lines = text.trim().split(/\r\n|\n/);
            if(lines.length === 0) return [];
            let headers = lines[0].split(',').map(e => e.replace(/^"|"$/g, '').trim());
            let result = [];
            for(let i=1; i<lines.length; i++) {
                let currentLine = lines[i].split(',').map(e => e.replace(/^"|"$/g, '').trim());
                if(currentLine.length === headers.length) {
                    let obj = {};
                    for(let j=0; j<headers.length; j++) obj[headers[j]] = currentLine[j];
                    result.push(obj);
                }
            }
            return result;
        }

        async function initDashboard() {
            document.getElementById('header-prov').innerText = `پروفایل استان ${urlProvince}`;
            
            try {
                const [subRes, mapRes, trendRes, topRes] = await Promise.all([
                    fetch('data/subtopic_scores.csv'), fetch('data/map_scores.csv'), fetch('data/trend_score.csv'), fetch('data/topics.csv')
                ]);
                
                subtopicsData = parseCSV(await subRes.text());
                mapScoresData = parseCSV(await mapRes.text());
                trendScoreData = parseCSV(await trendRes.text());
                
                let topicsMeta = parseCSV(await topRes.text());
                uniqueTopics = topicsMeta.map(t => ({ name: t.topic_name, color: t.upper_color || '#3b82f6' }));

                if(!currentTopic && uniqueTopics.length > 0) {
                    currentTopic = uniqueTopics[0].name;
                }

                buildTopicBoxes();
                updateDashboard(currentTopic);
                
            } catch(e) {
                console.error(e);
                alert("مشکل در خواندن فایل‌های CSV");
            }
        }

        function buildTopicBoxes() {
            const container = document.getElementById('topics-container');
            container.innerHTML = '';
            
            uniqueTopics.forEach(t => {
                const btn = document.createElement('button');
                btn.className = `topic-btn flex-1 w-full h-48 rounded-2xl border-2 text-center font-bold text-gray-700 ${t.name === currentTopic ? 'active border-blue-500' : 'border-gray-200'}`;
                
                let topicImgPath = `assets/images/تاپیک ${t.name}.webp`;
                btn.style.backgroundImage = `url('${topicImgPath}')`;
                
                btn.innerHTML = `<span>${t.name}</span>`;

                btn.onclick = () => {
                    currentTopic = t.name;
                    document.querySelectorAll('.topic-btn').forEach(b => {
                        b.classList.remove('active', 'border-blue-500');
                        b.classList.add('border-gray-200');
                    });
                    btn.classList.remove('border-gray-200');
                    btn.classList.add('active', 'border-blue-500');
                    updateDashboard(t.name);
                };
                container.appendChild(btn);
            });
        }

        function updateDashboard(topicName) {
            document.getElementById('polar-title').innerText = `امتیازات زیرحوزه‌های: ${topicName}`;

            let mapRow = mapScoresData.find(m => m.province_name === urlProvince && m.topic_name === topicName);
            let score = mapRow ? Number(mapRow.index_score) : 0;
            let rank = mapRow ? mapRow.province_rank : "-";
            
            document.getElementById('box-rank').innerText = `${rank} / 31`;
            document.getElementById('box-score').innerText = score;

            let pTrends = trendScoreData.filter(tr => tr.province_name === urlProvince && tr.topic_name === topicName);
            pTrends.sort((a,b) => Number(a.year) - Number(b.year));
            
            if(pTrends.length >= 2) {
                let current = Number(pTrends[pTrends.length-1].index_score);
                let prev = Number(pTrends[pTrends.length-2].index_score);
                if(prev !== 0) {
                    let change = ((current - prev) / prev) * 100;
                    let icon = change > 0 ? '<i class="fa-solid fa-arrow-trend-up text-green-300"></i>' : '<i class="fa-solid fa-arrow-trend-down text-red-300"></i>';
                    document.getElementById('box-change').innerHTML = `${Math.abs(change).toFixed(1)}% ${icon}`;
                }
            } else {
                document.getElementById('box-change').innerHTML = "- %";
            }

            drawDoughnut(score);

            let subs = subtopicsData.filter(s => s.province_name === urlProvince && s.topic_name === topicName);
            let labels = subs.map(s => s.subtopic_name);
            let data = subs.map(s => Number(s.subtopic_score));
            drawPolarChart(labels, data, topicName);
        }

        function drawDoughnut(score) {
            const ctx = document.getElementById('doughnutChart').getContext('2d');
            if(doughnutChart) doughnutChart.destroy();
            doughnutChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [score, 100 - score],
                        backgroundColor: ['#2563eb', '#e5e7eb'],
                        borderWidth: 0,
                        cutout: '75%'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { enabled: false } }, animation: { animateScale: true } }
            });
        }

        function drawPolarChart(labels, data, topicName) {
            const ctx = document.getElementById('polarChart').getContext('2d');
            if(polarChart) polarChart.destroy();

            let topicObj = uniqueTopics.find(t => t.name === topicName);
            let baseColor = topicObj && topicObj.color ? topicObj.color : '#3b82f6';

            // Generate scale of topic color variations for bars
            const colors = data.map((_, i) => {
                let alpha = 0.9 - (i * 0.12);
                if(alpha < 0.35) alpha = 0.35;
                return baseColor + Math.round(alpha * 255).toString(16).padStart(2, '0');
            });

            polarChart = new Chart(ctx, {
                type: 'polarArea',
                data: {
                    labels: labels,
                    datasets: [{ 
                        data: data, 
                        backgroundColor: colors,
                        borderColor: '#ffffff',
                        borderWidth: 3,         
                        hoverBorderWidth: 5,
                        spacing: 4              
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: { 
                        r: { 
                            min: -40, // Setting negative minimum creates a hollow space in the center, pushing the 0-value outward
                            max: 100, 
                            ticks: { display: false },
                            grid: { color: 'rgba(0,0,0,0.05)' }
                        } 
                    },
                    plugins: {
                        legend: { position: 'right', labels: { font: { family: 'Vazirmatn', size: 14 } } },
                        tooltip: { titleFont: { family: 'Vazirmatn', size: 14 }, bodyFont: { family: 'Vazirmatn', size: 14 } }
                    }
                },
                plugins: [polarCenterTextPlugin]
            });
        }

        window.onload = initDashboard;
    </script>
</body>
</html>
